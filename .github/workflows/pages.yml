name: Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find anchor A, the commit the last successful github-pages deployment published
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Read with this run's own token from the deployments record, which a push cannot write.
        # Tags are not used until a tag ruleset exists. Prints nothing if there is no such deployment.
        run: |
          node -e '
            const h = { Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json" };
            const api = p => fetch("https://api.github.com/repos/" + process.env.REPO + p, { headers: h }).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
            (async () => {
              for (const d of await api("/deployments?environment=github-pages&per_page=30")) {
                const st = await api("/deployments/" + d.id + "/statuses?per_page=1");
                if (st[0] && st[0].state === "success") { console.log("anchor=" + d.sha); return; }
              }
            })().catch(e => { console.error(e.message); process.exit(1); });
          ' >> "$GITHUB_OUTPUT"
      - name: Take every security check from anchor A (fails closed)
        id: trusted
        env:
          ANCHOR: ${{ steps.anchor.outputs.anchor }}
          REF: ${{ github.ref }}
        # A must exist, be an ancestor of the commit being built, and hold all three checks; the checks then judge
        # every commit in A..HEAD, so commits from runs that never deployed are covered. No other fallback.
        run: |
          [ "$REF" = refs/heads/dev ] || { echo "only dev is built here"; exit 1; }
          if [ -z "$ANCHOR" ] || ! git cat-file -e "$ANCHOR^{commit}" 2>/dev/null; then echo "no anchor: no verified deployment to start from"; exit 1; fi
          base=$(git rev-parse "$ANCHOR^{commit}")
          git merge-base --is-ancestor "$base" "$GITHUB_SHA" || { echo "anchor $base is not an ancestor of $GITHUB_SHA"; exit 1; }
          mkdir -p "$RUNNER_TEMP/trusted"
          for f in check-signatures.mjs check-commits.mjs leak-scan.mjs; do
            git show "$base:scripts/$f" > "$RUNNER_TEMP/trusted/$f" 2>/dev/null || { echo "anchor $base has no scripts/$f"; exit 1; }
          done
          echo "Trusted base: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Every pushed commit carries an Agent trailer (trusted copy)
        env:
          BASE: ${{ steps.trusted.outputs.base }}
        run: node "$RUNNER_TEMP/trusted/check-commits.mjs" "$BASE" "$GITHUB_SHA"
      - name: Every pushed commit is signed by a key in its parent's team/keys.json (trusted copy)
        env:
          BASE: ${{ steps.trusted.outputs.base }}
        run: node "$RUNNER_TEMP/trusted/check-signatures.mjs" "$BASE" "$GITHUB_SHA"
      - name: The signature check refuses what it should, for the right reason
        run: scripts/test-signatures.sh
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Smoke test in Chromium (every page at 390 and 1280 px, no console errors, no other hosts, the order flow where there is one)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs
      - name: Leak scan (tracked files and the built site; trusted copy)
        run: node "$RUNNER_TEMP/trusted/leak-scan.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  vault:
    # Seals this commit's files into the site's sgit vault when the SGIT_VAULT_KEY secret exists;
    # skipped cleanly without it. Separate from deploy, so a vault problem never blocks the site.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync the vault (only with the SGIT_VAULT_KEY secret; the key is never printed)
        env:
          SGIT_VAULT_KEY: ${{ secrets.SGIT_VAULT_KEY }}
          SGIT_TOKEN: ${{ secrets.SGIT_TOKEN }}
        run: scripts/vault-sync.sh
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

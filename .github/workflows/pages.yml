name: Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take every security check from the trusted base (fails closed)
        id: trusted
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        # The trusted base is the commit before this push; for a manual run on dev, the last release tag.
        # The signature, trailer and leak checks come only from that commit, never from the pushed tree.
        # If the base or any of the three is missing, the run stops: there is no other fallback.
        run: |
          if [ "$EVENT" = push ]; then base="$BEFORE"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF" = refs/heads/dev ]; then base=$(git tag --list "v${VERSION_BASE}.*" | sort -V | tail -1)
          else base=""; fi
          if [ -z "$base" ] || echo "$base" | grep -qE '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "no trusted base for this run"; exit 1; fi
          base=$(git rev-parse "$base^{commit}")
          git merge-base --is-ancestor "$base" "$GITHUB_SHA" || { echo "the trusted base $base is not an ancestor of $GITHUB_SHA"; exit 1; }
          mkdir -p "$RUNNER_TEMP/trusted"
          for f in check-signatures.mjs check-commits.mjs leak-scan.mjs; do
            git show "$base:scripts/$f" > "$RUNNER_TEMP/trusted/$f" 2>/dev/null || { echo "the trusted base has no scripts/$f"; exit 1; }
          done
          echo "Trusted base: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Every pushed commit carries an Agent trailer (trusted copy)
        env:
          BASE: ${{ steps.trusted.outputs.base }}
        run: node "$RUNNER_TEMP/trusted/check-commits.mjs" "$BASE" "$GITHUB_SHA"
      - name: Every pushed commit is signed by a key in its parent's team/keys.json (trusted copy)
        env:
          BASE: ${{ steps.trusted.outputs.base }}
        run: node "$RUNNER_TEMP/trusted/check-signatures.mjs" "$BASE" "$GITHUB_SHA"
      - name: The signature check refuses what it should, for the right reason
        run: scripts/test-signatures.sh
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Smoke test in Chromium (every page at 390 and 1280 px, no console errors, no other hosts, the order flow where there is one)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs
      - name: Leak scan (tracked files and the built site; trusted copy)
        run: node "$RUNNER_TEMP/trusted/leak-scan.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  vault:
    # Seals this commit's files into the site's sgit vault when the SGIT_VAULT_KEY secret exists;
    # skipped cleanly without it. Separate from deploy, so a vault problem never blocks the site.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync the vault (only with the SGIT_VAULT_KEY secret; the key is never printed)
        env:
          SGIT_VAULT_KEY: ${{ secrets.SGIT_VAULT_KEY }}
          SGIT_TOKEN: ${{ secrets.SGIT_TOKEN }}
        run: scripts/vault-sync.sh
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

<svg class="fig fig-journey" viewBox="0 0 480 440" role="img" aria-labelledby="fj-t fj-d">
  <title id="fj-t">Lisbon, the Algarve, London, and on to film</title>
  <desc id="fj-d">A map of Gabriel's route, with the cities at their real relative positions. Born in Lisbon, where he studied at the Instituto Gregoriano de Lisboa. In the mid-1980s his family moved to the Algarve, where he began formal lessons in guitar and composition. In the mid-1990s he moved to London: the Musicians Institute, a BTEC in Popular Music at City and Islington College, and a BMus (Hons) in Composition at the London College of Music. From there, a career across concert music, film, television, radio and new media, and in the last decade additional music on major Hollywood film productions.</desc>
  <g stroke="var(--fig-line)" stroke-width="1" opacity=".7">
    <line x1="0" y1="322" x2="480" y2="322" stroke-dasharray="2 6"/><line x1="0" y1="212" x2="480" y2="212" stroke-dasharray="2 6"/><line x1="0" y1="102" x2="480" y2="102" stroke-dasharray="2 6"/><line x1="0" y1="-8" x2="480" y2="-8" stroke-dasharray="2 6"/>
    <line x1="84" y1="0" x2="84" y2="440" stroke-dasharray="2 6"/><line x1="194" y1="0" x2="194" y2="440" stroke-dasharray="2 6"/><line x1="304" y1="0" x2="304" y2="440" stroke-dasharray="2 6"/><line x1="414" y1="0" x2="414" y2="440" stroke-dasharray="2 6"/>
  </g>
  <g class="fig-mono" fill="var(--fig-muted)" opacity=".8">
    <text x="4" y="98">50°N</text><text x="4" y="318">40°N</text>
  </g>
  <path d="M103 350 Q 143 380 130 388" fill="none" stroke="var(--fig-accent)" stroke-width="2.5"/>
  <path d="M130 388 C 280 328 241 229 301 69" fill="none" stroke="var(--fig-accent)" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M301 69 C 181 9 80 40 6 70" fill="none" stroke="var(--fig-signal)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M14 62 L4 71 L17 76" fill="none" stroke="var(--fig-signal)" stroke-width="2.5"/>
  <circle cx="103" cy="350" r="8" fill="var(--fig-accent)"/><circle cx="130" cy="388" r="8" fill="var(--fig-accent)"/><circle cx="301" cy="69" r="8" fill="var(--fig-accent)"/>
  <g class="fig-label" fill="var(--fig-ink)">
    <text x="119" y="336">Lisbon</text>
    <text x="146" y="406">The Algarve</text>
    <text x="326" y="82">London</text>
  </g>

<svg class="fig fig-cuemap" viewBox="0 0 480 262" role="img" aria-labelledby="fq-t fq-d">
  <title id="fq-t">His film cues, reel by reel</title>
  <desc id="fq-d">Each of Gabriel's cues on SoundCloud placed by its name: the number before M is the reel, the number after it the cue. The Bay: episode 20, reel 1, cue 3. War Flowers: reel 1 cue 25, reel 2 cue 14. The Gauntlet: reel 2 cue 1, reel 3 cues 3 and 10, reel 4 cue 1. Positions show the cue numbers, not timings.</desc>
